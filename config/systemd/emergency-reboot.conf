# Installed by scripts/configure.py as a drop-in for emergency.service and rescue.service.
#
# The pi image has no usable root login on the console, so emergency/rescue mode is a dead end
# on a customer unit: it just sits at a sulogin prompt nobody can answer. Reboot instead. On a
# trial slot that rolls back to the known-good slot; the delay leaves a window to read the
# console when debugging on the bench.
[Service]
ExecStart=
ExecStart=-/bin/sh -c 'echo "AmpliPi: boot failed into emergency mode - rebooting in 60s" > /dev/console; sleep 60; systemctl --no-block reboot'
