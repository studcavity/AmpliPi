# Installed by scripts/configure.py to /etc/systemd/system.conf.d/amplipi-watchdog.conf
#
# Any hang that stops systemd from petting the hardware watchdog resets the board. On a trial
# (tryboot) slot, a reset is an ordinary reboot without the tryboot flag, so the bootloader comes
# back up on the known-good default slot: a hang becomes an automatic rollback instead of a unit
# sitting dead until someone power-cycles it. On an already-committed slot it's just a reboot.
[Manager]
# bcm2835-wdt's hardware maximum is ~15s.
RuntimeWatchdogSec=15s
# Covers hangs during shutdown/reboot itself (e.g. a stuck unmount).
RebootWatchdogSec=2min
# If PID 1 itself crashes, reboot rather than freezing.
CrashReboot=yes
